version: '3.8'

services:
  madeena-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: madeena-core:latest
    container_name: madeena-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - DEBUG=false
    volumes:
      # Mount logs directory if needed
      - ./logs:/app/logs
    networks:
      - madeena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  madeena-network:
    driver: bridge
